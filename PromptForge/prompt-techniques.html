  med:{t:"Date calculation",p:"Write Python (datetime only) to answer:\n\"A project starts on 2026-11-02 and needs 45 working days (Mon–Fri, excluding 2026-11-14 and 2026-12-25). What is the end date?\"\nPrint the date and the number of calendar days elapsed.",w:"Working-day maths is a classic source of LLM errors — code fixes it."},
  high:{t:"Loan comparison",p:"Write Python to compare two home-loan offers for ₹50,00,000:\nA) 8.4% for 20 years\nB) 8.1% for 20 years + ₹75,000 processing fee\n\nCompute EMI, total interest and total cost for each. Print a neat comparison table and state which is cheaper overall and by how much. Use the standard EMI formula; explain it in a comment.",w:"Financial formulas executed exactly, with a comparison table."},
  expert:{t:"Data analysis + chart",p:"You will receive a CSV with columns: date, region, product, units, revenue.\n\nWrite a single Python script (pandas + matplotlib) that:\n1. Parses dates and handles missing revenue by units × median price per product.\n2. Computes monthly revenue by region.\n3. Finds the month-over-month growth % and flags drops > 10%.\n4. Saves a line chart (one line per region) as revenue.png.\n5. Prints a summary table of flagged drops.\n\nComment every block with the reasoning. Don't explain outside the code.",w:"PAL for real data work — cleaning, analysis and a visualisation output."},
  complex:{t:"Simulation for decision-making",p:"Our support queue: tickets arrive on average 14/hour (Poisson). Each agent resolves one ticket in an exponential time with mean 12 minutes. SLA: 90% of tickets start within 10 minutes.\n\nWrite a Python discrete-event simulation (standard library + numpy only) that:\n- Simulates 8-hour shifts, 500 runs each, for 2 to 6 agents\n- Measures % of tickets meeting the SLA and average wait\n- Prints a table: agents | SLA % | avg wait | 95th pct wait\n- Recommends the minimum agents that meet the SLA in ≥ 95% of runs\n\nUse a fixed random seed. Explain the model assumptions in a docstring.",w:"Turns an analytical question into a simulation — computation the model could never do reliably in text."}
 }
},
/* ---------------- 18. REACT ---------------- */
{
 id:"react", cat:"tools", name:"ReAct (Reason + Act)", tagline:"Thought → Action → Observation loop.",
 what:"ReAct interleaves reasoning and acting: the model writes a Thought about what to do, takes an Action (such as a search or API call), reads the Observation that comes back, and repeats until it can give a Final Answer. Reasoning keeps actions purposeful, and observations keep reasoning grounded in real data. It's the foundation of most AI agents and is excellent for multi-step research, troubleshooting and tasks requiring information gathering. The visible trace also makes the agent's behaviour easy to audit.",
 keys:[
  ["Define the loop format","Thought / Action / Observation / … / Final Answer."],
  ["List allowed actions","Names, inputs, what each returns."],
  ["One action per step","Then wait for the observation."],
  ["Ground thoughts in observations","Never assume an action's result."],
  ["Set a step limit","Prevents endless loops."],
  ["Define the stop condition","When enough evidence exists, give the Final Answer."]
 ],
 ex:{
  low:{t:"Single loop",p:"Answer using this format:\nThought: …\nAction: search[query]\nObservation: (I will provide)\nFinal Answer: …\n\nQuestion: Who is the current CEO of the company that makes the Pixel phone?",w:"Even one Thought→Action cycle prevents answering from stale memory."},
  med:{t:"Multi-hop question",p:"Use Thought / Action / Observation steps. Actions: search[query], lookup[term].\nMax 5 steps.\n\nQuestion: Which is taller — the tallest building in Mumbai or the tallest building in Kuala Lumpur — and by how many metres?",w:"Requires two lookups plus a comparison — natural ReAct territory."},
  high:{t:"Troubleshooting agent",p:"You are a troubleshooting agent. Actions available:\n- check_service(name) → status\n- read_logs(service, minutes) → last log lines\n- ping(host) → latency or timeout\n\nProblem: \"Users can't upload files since 10:05.\"\n\nLoop: Thought → Action → Observation. Max 8 steps.\nAfter each observation, state which hypotheses are now more or less likely.\nFinish with: Root cause, Evidence, Recommended fix.",w:"Hypothesis tracking makes each action purposeful and the conclusion evidence-based."},
  expert:{t:"Research with a budget",p:"Goal: Produce a one-page brief on 'adoption of passkeys by Indian banks in 2026'.\n\nActions: web_search[q], open_url[url], note[text]\nRules:\n- Max 10 actions total; state remaining budget in each Thought.\n- Prefer primary sources (bank sites, regulators) over blogs.\n- Use note[] to save each key fact with its source.\n- If two sources conflict, open a third.\n\nFinal Answer: brief with sections (Status, Key players, Barriers, Outlook) and a source list built from your notes.",w:"Budgeted actions, source preferences and a note-taking memory — a disciplined research agent."},
  complex:{t:"Agent with write actions & safety",p:"You are an ops agent for an ITSM platform.\n\nRead actions (free to use): query_incidents[filter], get_ci[name], get_changes[ci, hours]\nWrite actions (REQUIRE approval): update_incident[id, fields], create_problem[summary, linked_ids]\n\nTask: 40+ incidents about \"VPN disconnects\" were raised in the last 2 hours. Investigate and coordinate.\n\nProcess:\n1. Thought/Action/Observation loop using read actions to find common CI, recent changes and patterns.\n2. When confident (state confidence %), PROPOSE write actions as a numbered plan — do not execute.\n3. Wait for \"APPROVED\" before any write action.\n4. After approval, execute, observe results, and report.\n\nMax 12 read actions. If confidence stays < 70%, stop and escalate with your evidence.",w:"Separates read vs. write actions with a human-approval gate and confidence threshold — production-safe ReAct."}
 }
}
];

/* ============================================================
   STATE
   ============================================================ */
const store = {
  get(k,d){try{const v=localStorage.getItem("pa_"+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("pa_"+k,JSON.stringify(v))}catch(e){}}
};
let done = new Set(store.get("done",[]));
let current = 0;
let viewMode = store.get("view","tabs");  // tabs | accordion
let activeLevel = 0;
let closedCats = new Set(store.get("closedCats",[]));

const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* order techniques by category for navigation */
const ORDER = [];
Object.keys(CATS).forEach(c => T.forEach((t,i) => { if(t.cat===c) ORDER.push(i); }));

/* ============================================================
   SIDEBAR
   ============================================================ */
const ICON_CHEV = '<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
const ICON_CHECK = '<svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

function buildNav(){
  const q = $("#search").value.trim().toLowerCase();
  let html = "", any = false;
  Object.entries(CATS).forEach(([ck,cat])=>{
    const items = ORDER.filter(i=>T[i].cat===ck).filter(i=>{
      if(!q) return true;
      const t=T[i]; return (t.name+" "+t.tagline+" "+t.what).toLowerCase().includes(q);
    });
    if(!items.length) return;
    any = true;
    const closed = closedCats.has(ck) && !q;
    html += `<div class="cat ${closed?"closed":""}" data-cat="${ck}">
      <button class="cat-head" title="${cat.name}"><span class="cat-dot" style="background:${cat.color}"></span><span class="cat-label">${cat.name}</span><span class="cat-count">${items.length}</span>${ICON_CHEV}</button>
      <div class="cat-body"><div>`;
    items.forEach(i=>{
      const pos = ORDER.indexOf(i)+1;
      html += `<button class="nav-item ${i===current?"active":""} ${done.has(T[i].id)?"done":""}" data-i="${i}" title="${T[i].name}">
        <span class="num">${pos}</span><span class="nm">${T[i].name}</span>${ICON_CHECK}</button>`;
    });
    html += `</div></div></div>`;
  });
  $("#nav").innerHTML = html;
  $("#emptyNav").style.display = any ? "none" : "block";
}
$("#nav").addEventListener("click",e=>{
  const head = e.target.closest(".cat-head");
  if(head){
    if($("#app").classList.contains("collapsed")) return;
    const c = head.parentElement, k = c.dataset.cat;
    c.classList.toggle("closed");
    c.classList.contains("closed") ? closedCats.add(k) : closedCats.delete(k);
    store.set("closedCats",[...closedCats]);
    return;
  }
  const it = e.target.closest(".nav-item");
  if(it){ go(+it.dataset.i); $("#app").classList.remove("mobile-open"); }
});
$("#search").addEventListener("input",buildNav);
$("#collapseBtn").addEventListener("click",()=>{
  $("#app").classList.toggle("collapsed");
  store.set("collapsed",$("#app").classList.contains("collapsed"));
});
$("#menuBtn").addEventListener("click",()=>$("#app").classList.add("mobile-open"));
$("#scrim").addEventListener("click",()=>$("#app").classList.remove("mobile-open"));
if(store.get("collapsed",false)) $("#app").classList.add("collapsed");

function updateProgress(){
  $("#progTxt").textContent = `${done.size} / ${T.length}`;
  $("#progBar").style.width = (done.size/T.length*100)+"%";
}

/* ============================================================
   MAIN RENDER
   ============================================================ */
function hlPrompt(p){
  let s = esc(p);
  s = s.replace(/(&lt;\/?[a-zA-Z_][\w-]*(?:\s[^&]*?)?&gt;)/g,'<span class="tg">$1</span>');
  s = s.replace(/^((?:PROMPT|Step|STEP|Round|Phase|Part|Level|Variant|Attempt)\s?[\w\d—\-]*[^\n:]*:)/gm,'<span class="hl">$1</span>');
  return s;
}
const ICON_COPY = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const ICON_BULB = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg>';

function exampleBody(t,lv){
  const e = t.ex[lv.k];
  return `<pre class="prompt">${hlPrompt(e.p)}</pre>
    <div class="why">${ICON_BULB}<div><b>Why it works:</b> ${esc(e.w)}</div></div>`;
}

function renderExamples(t){
  if(viewMode==="tabs"){
    const lv = LEVELS[activeLevel], e = t.ex[lv.k];
    return `<div class="tabs" id="tabs">
        <div class="tab-ind" id="tabInd"></div>
        ${LEVELS.map((l,i)=>`<button class="tab ${i===activeLevel?"on":""}" data-l="${i}" style="--c:${l.c}"><i></i>${l.label}</button>`).join("")}
      </div>
      <div class="tab-panel" key="${activeLevel}">
        <div class="ex">
          <div class="ex-meta"><span class="lvl" style="--c:${lv.c}">${lv.label}</span><h3>${esc(e.t)}</h3>
            <button class="copy" data-copy="${lv.k}">${ICON_COPY}<span>Copy</span></button></div>
          ${exampleBody(t,lv)}
        </div>
      </div>`;
  }
  return `<div class="acc">${LEVELS.map((l,i)=>`
    <div class="acc-item ${i===activeLevel?"open":""}" data-l="${i}">
      <button class="acc-btn"><span class="lvl" style="--c:${l.c}">${l.label}</span><h3>${esc(t.ex[l.k].t)}</h3>${ICON_CHEV}</button>
      <div class="acc-body"><div><div class="acc-inner">
        <div class="acc-tools"><button class="copy" data-copy="${l.k}">${ICON_COPY}<span>Copy</span></button></div>
        ${exampleBody(t,l)}
      </div></div></div>
    </div>`).join("")}</div>`;
}

function render(){
  const t = T[current], cat = CATS[t.cat];
  const pos = ORDER.indexOf(current);
  const prev = pos>0 ? T[ORDER[pos-1]] : null;
  const next = pos<ORDER.length-1 ? T[ORDER[pos+1]] : null;
  const isDone = done.has(t.id);
  $("#crumb").innerHTML = `${cat.name} &nbsp;/&nbsp; <b>${t.name}</b>`;

  $("#content").innerHTML = `
    <section class="card hero fade" style="--hero-c:${cat.color}33">
      <span class="pill"><i style="background:${cat.color}"></i>${cat.name} · Technique ${pos+1} of ${T.length}</span>
      <h1>${t.name}</h1>
      <div class="tagline">${t.tagline}</div>
      <p>${t.what}</p>
      <div class="hero-actions">
        <button class="btn primary ${isDone?"on":""}" id="doneBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          ${isDone?"Learned ✓":"Mark as learned"}</button>
        <button class="btn" id="jumpEx">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
          Jump to examples</button>
      </div>
    </section>

    <section class="card fade">
      <div class="sec-title"><div class="sec-ic">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.3-9.3M17 6l3 3M14 9l2 2"/></svg>
      </div><div><h2>How to use it</h2><small>The keys to applying this technique well</small></div></div>
      <div class="keys">${t.keys.map((k,i)=>`<div class="key"><span class="kn">${i+1}</span><div><b>${esc(k[0])}</b><span>${esc(k[1])}</span></div></div>`).join("")}</div>
    </section>

    <section class="card fade" id="exSec">
      <div class="ex-head">
        <div class="sec-title" style="margin:0"><div class="sec-ic">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6M12 19h8"/></svg>
        </div><div><h2>Examples by level</h2><small>Low → Medium → High → Expert → Complex</small></div></div>
        <div class="seg" id="seg">
          <div class="slider" id="segSlider"></div>
          <button data-v="tabs" class="${viewMode==="tabs"?"on":""}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v5"/></svg>Tabs</button>
          <button data-v="accordion" class="${viewMode==="accordion"?"on":""}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Accordion</button>
        </div>
      </div>
      <div id="exWrap">${renderExamples(t)}</div>
    </section>

    <nav class="pager fade">
      <button class="pg prev" ${prev?"":"disabled"} data-i="${prev?ORDER[pos-1]:""}"><small>← Previous</small><b>${prev?prev.name:"—"}</b></button>
      <button class="pg next" ${next?"":"disabled"} data-i="${next?ORDER[pos+1]:""}"><small>Next →</small><b>${next?next.name:"—"}</b></button>
    </nav>`;
  requestAnimationFrame(()=>{moveSeg();moveTabInd();});
}

function rerenderExamples(){
  $("#exWrap").innerHTML = renderExamples(T[current]);
  requestAnimationFrame(moveTabInd);
}
function moveTabInd(){
  const ind = $("#tabInd"); if(!ind) return;
  const on = document.querySelector(".tab.on"); if(!on) return;
  ind.style.left = on.offsetLeft+"px"; ind.style.width = on.offsetWidth+"px";
  ind.style.setProperty("--ind-c", LEVELS[activeLevel].c);
}
function moveSeg(){
  const s = $("#segSlider"), on = document.querySelector("#seg button.on"); if(!s||!on) return;
  s.style.left = on.offsetLeft+"px"; s.style.width = on.offsetWidth+"px";
}

/* delegated events in content */
$("#content").addEventListener("click",e=>{
  const tab = e.target.closest(".tab");
  if(tab){ activeLevel = +tab.dataset.l; rerenderExamples(); return; }

  const segb = e.target.closest("#seg button");
  if(segb && segb.dataset.v!==viewMode){
    viewMode = segb.dataset.v; store.set("view",viewMode);
    document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b===segb));
    moveSeg(); rerenderExamples(); return;
  }

  const copy = e.target.closest(".copy");
  if(copy){
    e.stopPropagation();
    const txt = T[current].ex[copy.dataset.copy].p;
    const ok = ()=>{copy.classList.add("ok");copy.querySelector("span").textContent="Copied";toast("Prompt copied to clipboard");
      setTimeout(()=>{copy.classList.remove("ok");copy.querySelector("span").textContent="Copy"},1600)};
    if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).then(ok).catch(()=>fallbackCopy(txt)&&ok()); }
    else if(fallbackCopy(txt)) ok();
    return;
  }

  const accb = e.target.closest(".acc-btn");
  if(accb){
    const item = accb.parentElement;
    item.classList.toggle("open");
    if(item.classList.contains("open")) activeLevel = +item.dataset.l;
    return;
  }

  if(e.target.closest("#doneBtn")){
    const id = T[current].id;
    if(done.has(id)){done.delete(id);toast("Unmarked")}else{done.add(id);toast("Nice — marked as learned 🎉")}
    store.set("done",[...done]); updateProgress(); buildNav();
    const b=$("#doneBtn"); b.classList.toggle("on",done.has(id));
    b.lastChild.textContent = done.has(id)?" Learned ✓":" Mark as learned";
    return;
  }
  if(e.target.closest("#jumpEx")){ $("#exSec").scrollIntoView({behavior:"smooth",block:"start"}); return; }

  const pg = e.target.closest(".pg");
  if(pg && pg.dataset.i!=="") go(+pg.dataset.i);
});

function fallbackCopy(txt){
  try{const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
    const r=document.execCommand("copy");ta.remove();return r;}catch(e){return false}
}
let toastT;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1800)}

function go(i){
  current = i; activeLevel = 0;
  try{history.replaceState(null,"","#"+T[i].id)}catch(e){}
  render(); buildNav();
  $("#main").scrollTo({top:0,behavior:"smooth"});
  const a = document.querySelector(".nav-item.active"); if(a) a.scrollIntoView({block:"nearest"});
}

/* keyboard */
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"){ if(e.key==="Escape"){e.target.value="";buildNav();e.target.blur()} return; }
  const pos = ORDER.indexOf(current);
  if(e.key==="ArrowRight" && pos<ORDER.length-1) go(ORDER[pos+1]);
  else if(e.key==="ArrowLeft" && pos>0) go(ORDER[pos-1]);
  else if(/^[1-5]$/.test(e.key)){
    activeLevel = +e.key-1; rerenderExamples();
  }
  else if(e.key==="/"){ e.preventDefault(); if($("#app").classList.contains("collapsed")) $("#app").classList.remove("collapsed"); $("#search").focus(); }
});
window.addEventListener("resize",()=>{moveSeg();moveTabInd();});

/* init */
const fromHash = T.findIndex(t=>"#"+t.id===location.hash);
current = fromHash>=0 ? fromHash : ORDER[0];
buildNav(); updateProgress(); render();
</script>
</body>
</html>
