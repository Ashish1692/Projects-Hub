<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    /* Light Mode */
    .bg { fill: #4f46e5; }
    .step-1 { fill: #a5b4fc; }
    .step-2 { fill: #c7d2fe; }
    .step-3 { fill: #ffffff; }
    .arrow { fill: #38bdf8; }

    /* Dark Mode Auto-Switch */
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .step-1 { fill: #312e81; }
      .step-2 { fill: #4338ca; }
      .step-3 { fill: #6366f1; }
      .arrow { fill: #38bdf8; }
    }
  </style>

  <!-- Rounded App Tile -->
  <rect width="100" height="100" rx="20" class="bg" />

  <!-- Enlarged Step Bars -->
  <rect x="12" y="60" width="22" height="28" rx="5" class="step-1" />
  <rect x="39" y="42" width="22" height="46" rx="5" class="step-2" />
  <rect x="66" y="24" width="22" height="64" rx="5" class="step-3" />

  <!-- Scaled Guide Arrow -->
  <path d="M 66 8 L 90 8 L 90 32 Z" class="arrow" />
</svg>
