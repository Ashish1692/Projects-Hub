<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Adjust stop-color hex codes for your version) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Checkmark Gradient -->
    <linearGradient id="checkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Container Base (App Icon Frame) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)" />

  <!-- Accent Inner Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#60A5FA" stroke-width="12" opacity="0.3" />

  <!-- Signature Checkmark -->
  <path d="M156 260 L228 332 L356 188" 
        fill="none" 
        stroke="url(#checkGradient)" 
        stroke-width="48" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#shadow)" />
</svg>
