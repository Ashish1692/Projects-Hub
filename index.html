<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects Hub</title>
    <link rel="icon" href="./icons8-markdown-96.png">
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-light: #a29bfe;
            --bg: #0f0f1a;
            --bg-soft: #14142499;
            --card-bg: #1a1a2e;
            --text: #e6e6f0;
            --text-muted: #8b8ba7;
            --accent-green: #00cec9;
            --border: #2d2d4a;
            --border-soft: #23233c;
            --radius: 16px;
            --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
            --max-w: 1180px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(900px 500px at 15% -5%, #2a2350 0%, transparent 60%),
                radial-gradient(800px 480px at 90% 0%, #0f3460 0%, transparent 55%),
                var(--bg);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .wrap { width: 100%; max-width: var(--max-w); margin: 0 auto; padding: 0 20px; }

        :focus-visible {
            outline: 2px solid var(--primary-light);
            outline-offset: 3px;
            border-radius: 8px;
        }

        /* ── Header ── */
        header { padding: 72px 0 36px; text-align: center; }
        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--bg-soft);
            color: var(--text-muted);
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }
        .eyebrow .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 0 4px rgba(0, 206, 201, 0.15);
        }
        header h1 {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.02em;
            background: linear-gradient(120deg, var(--primary-light), var(--accent-green));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 14px;
        }
        header p {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.6;
            max-width: 560px;
            margin: 0 auto;
        }

        /* ── Sticky controls ── */
        .controls-bar {
            position: sticky;
            top: 0;
            z-index: 20;
            padding: 14px 0;
            background: rgba(15, 15, 26, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid transparent;
            transition: border-color 0.25s, background 0.25s;
        }
        .controls-bar.stuck {
            border-bottom-color: var(--border-soft);
            background: rgba(15, 15, 26, 0.92);
        }
        .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

        .search-wrap { position: relative; flex: 1 1 260px; min-width: 220px; }
        .search-wrap svg {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            width: 17px; height: 17px; color: var(--text-muted); pointer-events: none;
        }
        .search-box {
            width: 100%;
            padding: 12px 42px 12px 42px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 0.98rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        .search-box::placeholder { color: var(--text-muted); }
        .search-box:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.18);
        }
        .clear-btn {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            width: 26px; height: 26px; border: 0; border-radius: 50%;
            background: var(--border); color: var(--text-muted);
            font-size: 1rem; line-height: 1; cursor: pointer; display: none;
        }
        .clear-btn:hover { color: #fff; background: var(--primary); }
        .search-wrap.has-value .clear-btn { display: block; }

        .filters { display: flex; flex-wrap: wrap; gap: 8px; }
        .filter-btn {
            padding: 10px 16px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-muted);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .filter-btn .count { opacity: 0.55; font-weight: 500; margin-left: 5px; }
        .filter-btn:hover { color: var(--text); border-color: var(--primary-light); }
        .filter-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .result-count {
            padding: 14px 0 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* ── Project grid ── */
        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 22px;
            padding: 18px 0 70px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 26px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }
        .card[hidden] { display: none; }
        .card::before {
            content: '';
            position: absolute; inset: 0 0 auto 0;
            height: 3px;
            background: var(--card-accent, var(--primary));
        }
        .card::after {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(420px 220px at 50% -30%, var(--card-accent, var(--primary)), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--card-accent, var(--primary));
            box-shadow: var(--shadow);
        }
        .card:hover::after { opacity: 0.09; }

        .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }
        .card-icon {
            width: 52px; height: 52px;
            display: grid; place-items: center;
            font-size: 1.7rem;
            border-radius: 14px;
            background: color-mix(in srgb, var(--card-accent, var(--primary)) 16%, transparent);
            border: 1px solid color-mix(in srgb, var(--card-accent, var(--primary)) 35%, transparent);
        }
        .status {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            border: 1px solid var(--border);
            color: var(--text-muted);
            white-space: nowrap;
        }
        .status i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; font-style: normal; }
        .status-live { color: #2fd28f; border-color: rgba(47, 210, 143, 0.35); background: rgba(47, 210, 143, 0.1); }
        .status-wip  { color: #fdcb6e; border-color: rgba(253, 203, 110, 0.35); background: rgba(253, 203, 110, 0.1); }
        .status-soon { color: #8b8ba7; }

        .card h2 { font-size: 1.22rem; color: #fff; margin-bottom: 8px; letter-spacing: -0.01em; }
        .card .description {
            color: var(--text-muted);
            font-size: 0.92rem;
            line-height: 1.65;
            flex: 1;
            margin-bottom: 18px;
        }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
        .tag {
            padding: 4px 10px;
            border-radius: 7px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            background: #2b2b46;
            color: var(--text);
        }
        .tag[data-t="html"]   { background: #e17055; color: #fff; }
        .tag[data-t="css"]    { background: #0984e3; color: #fff; }
        .tag[data-t="js"]     { background: #fdcb6e; color: #2d3436; }
        .tag[data-t="react"]  { background: #61dafb; color: #10202b; }
        .tag[data-t="api"]    { background: #00cec9; color: #10202b; }
        .tag[data-t="markdown"]{ background: #b39ddb; color: #1d1533; }

        .card-link {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            align-self: flex-start;
            padding: 11px 20px;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            border-radius: 11px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.25s, gap 0.25s, opacity 0.25s;
        }
        .card-link:hover { background: var(--primary-light); gap: 12px; }
        .card-link svg { width: 16px; height: 16px; }
        .card-link.disabled {
            background: transparent;
            border: 1px dashed var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
            pointer-events: none;
        }

        /* ── Empty state ── */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 70px 20px;
            color: var(--text-muted);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
        }
        .empty-state span { font-size: 2.8rem; display: block; margin-bottom: 12px; }
        .empty-state p { margin-bottom: 16px; }
        .empty-state button {
            padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--card-bg); color: var(--text); cursor: pointer;
            font-family: inherit; font-size: 0.88rem;
        }
        .empty-state button:hover { border-color: var(--primary); }

        /* ── Footer ── */
        footer {
            margin-top: auto;
            text-align: center;
            padding: 28px 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-soft);
        }

        @media (max-width: 620px) {
            header { padding: 48px 0 26px; }
            .projects { grid-template-columns: 1fr; }
            .filters { width: 100%; overflow-x: auto; padding-bottom: 4px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; animation: none !important; }
            html { scroll-behavior: auto; }
        }
    </style>
</head>
<body>

<header>
    <div class="wrap">
        <div class="eyebrow"><span class="dot"></span> <span id="liveCount">0</span> projects live</div>
        <h1>🚀 My Projects Hub</h1>
        <p>A collection of all my HTML/CSS/JS projects — hosted from a single repository.</p>
    </div>
</header>

<div class="controls-bar" id="controlsBar">
    <div class="wrap controls">
        <div class="search-wrap" id="searchWrap">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/></svg>
            <input type="text" class="search-box" id="searchBox" placeholder="Search projects...  (press /)" autocomplete="off" aria-label="Search projects">
            <button class="clear-btn" id="clearBtn" aria-label="Clear search">×</button>
        </div>
        <div class="filters" id="filters"></div>
    </div>
</div>

<main class="wrap">
    <p class="result-count" id="resultCount"></p>
    <div class="projects" id="projectGrid"></div>
</main>

<footer>
    <p>Built with ❤️ | Hosted on GitHub Pages</p>
</footer>

<script>
/* ╔══════════════════════════════════════════════════════════════════════╗
   ║  ADD A NEW PROJECT — just append one object to the array below.      ║
   ║                                                                      ║
   ║  1. Create your folder:  /your-project/index.html                    ║
   ║  2. Copy the template object, fill it in, save, push.                ║
   ║  Everything else (card, tag colours, filter chips, counts) is        ║
   ║  generated automatically from this data.                             ║
   ║                                                                      ║
   ║  {                                                                   ║
   ║    title:  "Project Name",         // required                       ║
   ║    icon:   "🎨",                    // any emoji                      ║
   ║    description: "One or two lines about it.",                        ║
   ║    tags:   ["HTML", "CSS", "JS"],  // also drive the filter chips    ║
   ║    link:   "./your-project/index.html",                              ║
   ║    accent: "#6c5ce7",              // card top-bar + glow colour     ║
   ║    status: "live",                 // "live" | "wip" | "soon"        ║
   ║    cta:    "Open Project"          // optional button label          ║
   ║  }                                                                   ║
   ╚══════════════════════════════════════════════════════════════════════╝ */

const PROJECTS = [
    {
        title: "WorkDeck",
        icon: "🧮",
        description: "A personal workspace dashboard for tracking tasks, notes and daily work in one place.",
        tags: ["HTML", "CSS", "JS", "React"],
        link: "./dist/index.html",
        accent: "#00cec9",
        status: "live"
    },
    {
        title: "Step Guide V2",
        icon: "🪜",
        description: "Capture step-by-step records and turn them into shareable how-to documents.",
        tags: ["HTML", "CSS", "React"],
        link: "./step_guide_dist/index.html",
        accent: "#fdcb6e",
        status: "live"
    },
    {
        title: "MD Studio",
        icon: "📝",
        description: "A single-file Markdown viewer and editor with live preview.",
        tags: ["HTML", "CSS", "JS", "Markdown"],
        link: "./MarkdownViewr/md_studio.html",
        accent: "#b39ddb",
        status: "live"
    },
    {
        title: "Your Next Project",
        icon: "✨",
        description: "Add your next project here — create a folder, drop in an index.html, then add one object to the PROJECTS array.",
        tags: ["HTML", "CSS"],
        link: "#",
        accent: "#6c5ce7",
        status: "soon",
        cta: "Coming Soon"
    }
];

/* ── Nothing below needs editing when adding a project ── */

const grid       = document.getElementById('projectGrid');
const filtersEl  = document.getElementById('filters');
const searchBox  = document.getElementById('searchBox');
const searchWrap = document.getElementById('searchWrap');
const clearBtn   = document.getElementById('clearBtn');
const resultEl   = document.getElementById('resultCount');
const bar        = document.getElementById('controlsBar');

const slug   = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const esc    = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const STATUS = { live: 'Live', wip: 'In Progress', soon: 'Soon' };

let activeFilter = 'all';

const ARROW = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>';

function cardHTML(p) {
    const status   = p.status || 'live';
    const disabled = status === 'soon' || !p.link || p.link === '#';
    const cta      = p.cta || (disabled ? 'Coming Soon' : 'Open Project');
    const tags     = (p.tags || []);

    return `
    <article class="card" style="--card-accent: ${esc(p.accent || '#6c5ce7')};"
             data-tags="${tags.map(t => slug(t)).join(',')}"
             data-search="${esc([p.title, p.description, ...tags].join(' ').toLowerCase())}">
        <div class="card-top">
            <div class="card-icon">${esc(p.icon || '📦')}</div>
            <span class="status status-${status}"><i></i>${STATUS[status] || status}</span>
        </div>
        <h2>${esc(p.title)}</h2>
        <p class="description">${esc(p.description || '')}</p>
        <div class="tags">
            ${tags.map(t => `<span class="tag" data-t="${slug(t)}">${esc(t)}</span>`).join('')}
        </div>
        <a href="${disabled ? '#' : esc(p.link)}" class="card-link${disabled ? ' disabled' : ''}"
           ${disabled ? 'tabindex="-1" aria-disabled="true"' : ''}>
            ${esc(cta)} ${ARROW}
        </a>
    </article>`;
}

function buildFilters() {
    const counts = new Map();
    PROJECTS.forEach(p => (p.tags || []).forEach(t => {
        const k = slug(t);
        if (!counts.has(k)) counts.set(k, { label: t, n: 0 });
        counts.get(k).n++;
    }));

    const chips = [`<button class="filter-btn active" data-filter="all">All<span class="count">${PROJECTS.length}</span></button>`];
    [...counts.entries()]
        .sort((a, b) => b[1].n - a[1].n || a[1].label.localeCompare(b[1].label))
        .forEach(([key, v]) => chips.push(
            `<button class="filter-btn" data-filter="${key}">${esc(v.label)}<span class="count">${v.n}</span></button>`
        ));
    filtersEl.innerHTML = chips.join('');

    filtersEl.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            filtersEl.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeFilter = btn.dataset.filter;
            applyFilters();
        });
    });
}

function applyFilters() {
    const q = searchBox.value.trim().toLowerCase();
    searchWrap.classList.toggle('has-value', q.length > 0);

    let visible = 0;
    grid.querySelectorAll('.card').forEach(card => {
        const matchTag  = activeFilter === 'all' || card.dataset.tags.split(',').includes(activeFilter);
        const matchText = !q || card.dataset.search.includes(q);
        const show = matchTag && matchText;
        card.hidden = !show;
        if (show) visible++;
    });

    resultEl.textContent = visible === PROJECTS.length
        ? `${PROJECTS.length} project${PROJECTS.length === 1 ? '' : 's'}`
        : `${visible} of ${PROJECTS.length} projects`;

    let empty = grid.querySelector('.empty-state');
    if (!visible && !empty) {
        grid.insertAdjacentHTML('beforeend',
            '<div class="empty-state"><span>🔍</span><p>No projects match your search.</p><button id="resetBtn">Reset filters</button></div>');
        document.getElementById('resetBtn').addEventListener('click', reset);
    } else if (visible && empty) {
        empty.remove();
    }
}

function reset() {
    searchBox.value = '';
    activeFilter = 'all';
    filtersEl.querySelectorAll('.filter-btn').forEach((b, i) => b.classList.toggle('active', i === 0));
    applyFilters();
    searchBox.focus();
}

function render() {
    grid.innerHTML = PROJECTS.map(cardHTML).join('');
    document.getElementById('liveCount').textContent =
        PROJECTS.filter(p => (p.status || 'live') === 'live').length;
    buildFilters();
    applyFilters();
}

searchBox.addEventListener('input', applyFilters);
clearBtn.addEventListener('click', reset);
searchBox.addEventListener('keydown', e => { if (e.key === 'Escape') reset(); });

// "/" focuses search from anywhere
document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== searchBox) {
        e.preventDefault();
        searchBox.focus();
    }
});

// shadow under the sticky bar once scrolled
const sentinel = document.createElement('div');
document.body.insertBefore(sentinel, bar);
new IntersectionObserver(([e]) => bar.classList.toggle('stuck', !e.isIntersecting))
    .observe(sentinel);

render();
</script>

</body>
</html>
